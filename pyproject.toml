[project]
name = "minibilet"
version = "0.1.0"
description = "pytest öğrenmek için küçük bir etkinlik bileti servisi"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "time-machine>=2.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minibilet"]

# pytest ayarlarını O4'te buraya kendin ekleyeceksin: [tool.pytest.ini_options]
